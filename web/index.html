<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>麦门星球 · 点单游戏机</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 上半屏：备餐厅场景（可替换成你搭的像素场景，对接点见 game.js 顶部注释） -->
  <div id="scene-wrap">
    <canvas id="scene" width="240" height="200"></canvas>
    <!-- 号码牌高光时刻（真实取餐号） -->
    <div id="plate" class="hidden">
      <div class="plate-store" id="plate-store">麦门星球示例餐厅</div>
      <div class="plate-no" id="plate-no">A88</div>
      <div class="plate-hint">凭这个号去门店取餐 ↑</div>
    </div>
  </div>

  <!-- 下半屏：游戏机（LCD + 按键） -->
  <div id="console">
    <div id="lcd">
      <div id="lcd-title">McDONALD'S GamePlayer</div>
      <div id="lcd-body"></div>
      <div id="lcd-choices"></div>
    </div>
    <div id="pad">
      <div id="dpad">
        <button class="key" data-k="up">▲</button>
        <button class="key" data-k="left">◀</button>
        <button class="key" data-k="right">▶</button>
        <button class="key" data-k="down">▼</button>
      </div>
      <div id="ab">
        <button class="round" data-k="b">B</button>
        <button class="round a" data-k="a">A</button>
      </div>
    </div>
    <div id="meta">
      <button class="pill" data-k="start">START · 下单</button>
      <span id="mode-tag">demo</span>
    </div>
  </div>

<script src="scene.js"></script>
<script src="game.js"></script>
</body>
</html>
